[install]
description = "Restore the NuGet packages of dotnet/GameKit.slnx"
run = "scripts/install.sh"
quiet = true

[setup]
description = "Install dependencies and skill-kit, sync, then make everything the demo runs on: the weapon assets, catalog and default loadout (build-weapons), the game rules assets (build-rules), the ability assets and catalog (build-abilities), every demo scene with the net maps' server data (build-scenes) and the server's rules, points and tuning (export-server-rules), so the demo plays offline and against make server-dotnet (run by make setup; close the Editor first)"
depends = ["install"]
# アビリティのタレットと装備は武器のアセットを指し、build-scenes のシーンはルールとアビリティのカタログと装備を指し、export-server-rules は作ったシーンから地点を読むので、この順に走らせる
run = [
  "curl -fsSL https://raw.githubusercontent.com/omni-stove/skill-kit/main/install.sh | sh",
  "skill-kit game sync",
  "mise run build-weapons",
  "mise run build-rules",
  "mise run build-abilities",
  "mise run build-scenes",
  "mise run export-server-rules",
]

[build-scenes]
description = "Rebuild every demo scene (and write the net maps' server data, as export-server-data does) with the Unity editor in batch mode via Shooter.Editor.SceneBuildSteps.BuildAll, the Shooter/Build All Scenes menu (close the Editor first). Commit the result"
run = "unity --non-interactive run . -- -executeMethod Shooter.Editor.SceneBuildSteps.BuildAll"

[build-weapons]
description = "Rebuild the Demo weapon assets from their JSON (Weapons/Json, ReferenceJson, RealisticJson), the weapon catalog (Weapons/WeaponCatalog.asset) and the default loadout (Weapons/DefaultLoadout.asset) with the Unity editor in batch mode via Shooter.Editor.WeaponAssetBuilder.Build, the Shooter/Build Weapon Assets menu (close the Editor first). Commit the result"
run = "unity --non-interactive run . -- -executeMethod Shooter.Editor.WeaponAssetBuilder.Build"

[build-rules]
description = "Rebuild the Demo game rules assets (Rules/*.asset, the modes' rules among them) with the Unity editor in batch mode via Shooter.Editor.GameRulesAssetBuilder.Build, the Shooter/Build Game Rules Assets menu; export-server-rules reads each mode's Objective from them (close the Editor first). Commit the result"
run = "unity --non-interactive run . -- -executeMethod Shooter.Editor.GameRulesAssetBuilder.Build"

[build-abilities]
description = "Rebuild the Demo ability assets and the ability catalog (Abilities/AbilityCatalog.asset) with the Unity editor in batch mode via Shooter.Editor.AbilityAssetBuilder.Build, the Shooter/Build Ability Assets menu; it needs the Demo weapons and loadout, and game-content puts the catalog in GameContent (close the Editor first). Commit the result"
run = "unity --non-interactive run . -- -executeMethod Shooter.Editor.AbilityAssetBuilder.Build"

[update]
description = "Pull skill-kit and re-sync this repo"
run = "skill-kit game update"

[lint]
description = "Check C# formatting, style and analyzers (Unity-independent code via dotnet/GameKit.slnx, all of Assets/kits/shooter for whitespace) and that every tracked file/folder under Assets has a tracked .meta and vice versa"
run = "scripts/lint.sh"
quiet = true

[format]
description = "Fix what lint reports as fixable (adds missing .meta for .cs files and folders with git add)"
run = "scripts/lint.sh --fix"
quiet = true

[test]
description = "Run the Unity-independent C# unit tests (every test project in dotnet/GameKit.slnx) with dotnet test"
run = "scripts/test.sh"
quiet = true

[build]
description = "Build the client (macos by default, windows, or webgl) into Builds/client-<platform>/ with the Unity editor in batch mode (close the Editor first). The version is --version <v>, or git describe --tags --always --dirty"
usage = '''
arg "[platform]" help="macos, windows or webgl" default="macos"
flag "--version <version>" help="build version such as v0.2.0 (default: git describe --tags --always --dirty)"
'''
run = 'unity --non-interactive run . -- -executeMethod Shooter.Editor.ClientBuilder.Build -clientPlatform "${usage_platform:-macos}" ${usage_version:+-buildVersion "$usage_version"}'

[server-dotnet]
description = "Build the Unity-independent .NET server (dotnet/Shooter.Server) and run it with -mode server on 0.0.0.0:7777 (SHOOTER_SERVER_ADDRESS / SHOOTER_SERVER_PORT change it). It needs server-data/maps/<map>.fpsmap and .fpsnav (make export-server-data), and server-data/rules/<rules>.json and server-data/maps/<map>.points.json (make export-server-rules); -rules <name> picks the rules (default TeamDeathmatch), or -playlist <id> rotates the mode and map each match by server-data/playlists/*.json. Ctrl+C or SIGTERM drains; a second one stops at once. Type players, kick, ban, unban or help on stdin; --ban-file <path> keeps the bans (docs/dedicated-server.md). The version is git describe --tags --always --dirty"
# 管理のコマンドを端末から打てるよう、mise を挟まずにサーバーへ標準入力をつなぐ
raw = true
run = [
  "dotnet build dotnet/Shooter.Server/Shooter.Server.csproj -c Release -v q --nologo",
  'dotnet run --project dotnet/Shooter.Server/Shooter.Server.csproj -c Release --no-build -- -mode server -buildVersion "$(git describe --tags --always --dirty)"',
]

[export-server-data]
description = "Write the collision, the NavMesh with its links, the destructible structures, the ladders, the water, the vehicles, the ziplines and the breachable doors of every map selectable with -map to server-data/maps/<map>.fpsmap, <map>.fpsnav, <map>.structures.json, <map>.ladders.json, <map>.water.json, <map>.vehicles.json, <map>.ziplines.json and <map>.doors.json with the Unity editor in batch mode via Shooter.Editor.MapCollisionExporter.Export, removing those files of maps no longer listed (close the Editor first). Commit the result"
run = "unity --non-interactive run . -- -executeMethod Shooter.Editor.MapCollisionExporter.Export"

[export-server-rules]
description = "Write what the .NET server cannot read from Unity with the editor in batch mode via Shooter.Editor.ServerRulesExporter.Export (close the Editor first): the net match settings (Rules/NetMatch.asset, made by Shooter.Editor.NetSceneBuilder when missing) with the GameContent rules, each rules asset listed in the net match and every rules asset in the Rules folder with an objective other than None, but for the names in server-data/rules/hand-written.txt (kept by hand), to server-data/rules/<rules>.json (chosen with -rules; refused when another *.json is left there), each server map's spawn points, control points, flag bases, payload cart route, loot containers, extraction points and zone (adding the flag bases and the NetArena01 payload cart to a scene made before they existed, and making the NetBattleRoyale scene when missing) to server-data/maps/<map>.points.json, and the ping, grenade, inventory, knockback, bots, assist, loot, supply drop, redeploy, melee, streak, extraction, stash, stagger and suppression tuning (the GameContent field first, then Resources/Tuning, as KitTuning reads them) to server-data/tuning/ping.json, grenade.json, inventory.json, knockback.json, bots.json, assist.json, loot.json, supply-drops.json, redeploy.json, melee.json, streaks.json, extraction.json, stash.json, stagger.json and suppression.json. Commit the written files"
run = "unity run . -- -executeMethod Shooter.Editor.ServerRulesExporter.Export"

[eos-sdk]
description = "Place the EOS C# SDK in dotnet/ThirdParty/EOSSDK (not committed) from the PlayEveryWare EOS package in Library/PackageCache, from an Epic Developer Portal SDK zip/folder with --from <path>, or with --fetch from git at the version locked in Packages/packages-lock.json (no Unity needed; Linux x64 library only)"
# 実行権限の無いチェックアウトでも動くよう bash で呼ぶ。引数は mise がこの後ろに付ける
run = "bash scripts/eos-sdk.sh"

[server-image]
description = "Package the Unity-independent .NET server (dotnet/Shooter.Server) with server-data/ and the EOS SDK in dotnet/ThirdParty/EOSSDK (make eos-sdk; without it the image runs without EOS) as a Docker image with docker/server/Dockerfile. No Unity needed. Options: --tag <name:tag> (default shooter-server:local), --version <v> (default git describe --tags --always --dirty), --platform linux/amd64|linux/arm64"
# 実行権限の無いチェックアウトでも動くよう bash で呼ぶ。引数は mise がこの後ろに付ける
run = "bash scripts/server-image.sh"

[test-unity]
description = "Run the Unity EditMode tests headlessly in batch mode (close the Editor first)"
run = "unity test --mode EditMode"

[smoke]
description = "Run every SmokeRun in one batch-mode editor via Shooter.Editor.SmokeSuite.RunAll; exits non-zero if any fails or the suite did not run (close the Editor first). The Editor log goes to Logs/smoke.log and its [SmokeSuite] lines are printed. --root <dir> sets the output root (-shooterKitRoot)"
usage = '''
flag "--root <dir>" help="output root under Assets/ (default: the imported sample's folder)"
'''
# unity run は Editor に -quit を付け、Play Mode に入る SmokeRun が走る前に Editor が閉じるので、-quit を付けない unity open --batchmode --wait で起動する。
# unity open はプロジェクトが既に開かれていると何も起動せず 0 で終わるので、スイートが passed と書いたログが無ければ失敗にする
run = '''
mkdir -p Logs
rm -f Logs/smoke.log
status=0
unity --non-interactive open . --batchmode --wait --args "-executeMethod Shooter.Editor.SmokeSuite.RunAll ${usage_root:+-shooterKitRoot \"$usage_root\"} -logFile \"$PWD/Logs/smoke.log\"" || status=$?
grep -a -E '\[SmokeSuite\]|^  (passed|FAILED|NOT RUN) ' Logs/smoke.log || true
[ "$status" -eq 0 ] || exit "$status"
grep -a -q '\[SmokeSuite\] passed:' Logs/smoke.log || { echo "smoke: Logs/smoke.log has no [SmokeSuite] passed line; the suite did not run (is the project open in an Editor?)" >&2; exit 1; }
'''

[import-weapons]
description = "Import weapon JSON (one file, or every *.json directly in a folder) into WeaponDefinition assets via Shooter.Editor.WeaponJsonImporter.Import; saves nothing and exits 1 if any file is invalid (close the Editor first)"
usage = '''
arg "<json>" help="a JSON file or a folder of them"
flag "--out <dir>" help="asset folder under Assets/ (default: <output root>/Weapons)"
flag "--catalog <asset>" help="existing WeaponCatalogAsset to add the weapons to by Id"
flag "--root <dir>" help="output root under Assets/ (-shooterKitRoot)"
'''
run = 'unity --non-interactive run . -- -executeMethod Shooter.Editor.WeaponJsonImporter.Import -weaponJson "$usage_json" ${usage_out:+-weaponOut "$usage_out"} ${usage_catalog:+-weaponCatalog "$usage_catalog"} ${usage_root:+-shooterKitRoot "$usage_root"}'

[import-rules]
description = "Import game rules JSON (one file, or every *.json directly in a folder) into GameRulesDefinition assets via Shooter.Editor.GameRulesJsonImporter.Import; saves nothing and exits 1 if any file is invalid (close the Editor first)"
usage = '''
arg "<json>" help="a JSON file or a folder of them"
flag "--out <dir>" help="asset folder under Assets/ (default: <output root>/Rules)"
flag "--root <dir>" help="output root under Assets/ (-shooterKitRoot)"
'''
run = 'unity --non-interactive run . -- -executeMethod Shooter.Editor.GameRulesJsonImporter.Import -rulesJson "$usage_json" ${usage_out:+-rulesOut "$usage_out"} ${usage_root:+-shooterKitRoot "$usage_root"}'

[game-content]
description = "Create the GameContent entry asset (or fill its empty fields) via Shooter.Editor.GameContentAssets.Create (close the Editor first)"
usage = '''
flag "--path <asset>" help="asset path such as Assets/MyGame/Resources/ShooterKit/GameContent.asset (default: <output root>/Resources/ShooterKit/GameContent.asset)"
flag "--root <dir>" help="output root under Assets/ (-shooterKitRoot)"
'''
run = 'unity --non-interactive run . -- -executeMethod Shooter.Editor.GameContentAssets.Create ${usage_path:+-gameContent "$usage_path"} ${usage_root:+-shooterKitRoot "$usage_root"}'

[audit-replacements]
description = "List what a game left unreplaced (catalog entries per weapon Id, keys missing in a language, empty [RequiredReference] references) via Shooter.Editor.ReplacementAudit.Run; exits 0 when none, 1 when some, 2 when the audit throws (close the Editor first)"
run = "unity --non-interactive run . -- -executeMethod Shooter.Editor.ReplacementAudit.Run"

[nightly-local]
description = "Run the nightly workflow's steps locally: EditMode tests, the smoke suite, the map-data template's check (re-export and compare with server-data/maps), and on Sundays (JST) the macOS client build (close the Editor first). Options: --client to always build the client, --no-client to never"
# 実行権限の無いチェックアウトでも動くよう bash で呼ぶ。引数は mise がこの後ろに付ける
run = "bash scripts/nightly-local.sh"

[comments-extract]
description = "Print each comment block of the tracked .cs files under the given paths with its id and the next lines, for judging keep / delete / rewrite"
run = "bash scripts/comments.sh extract"

[comments-apply]
description = "Apply a decisions file of keep / delete / rewrite to the comment blocks extract printed"
run = "bash scripts/comments.sh apply"

[comments-verify]
description = "Check that the .cs changes since the merge base with main (or the given ref) touch only comments and blank lines, apart from removed usings"
run = "bash scripts/comments.sh verify"

[comments-test]
description = "Run the tests of scripts/comments.sh"
run = "bash scripts/comments-test.sh"

[lint-test]
description = "Run the tests of the /// comment check in scripts/lint.sh"
run = "bash scripts/lint-test.sh"

[affected-test]
description = "Run the tests of scripts/affected.sh and the --since option of scripts/lint.sh and scripts/test.sh (which CI checks a PR narrows to)"
run = "bash scripts/affected-test.sh"

[gitattributes-test]
description = "Run the tests of the attributes .gitattributes gives each file type (LF line endings, binary files)"
run = "sh scripts/gitattributes-test.sh"

[setup-test]
description = "Run the tests of the setup task, which checks that it makes every asset the demo runs on in the order they depend on"
run = "sh scripts/setup-test.sh"

[tasks-test]
description = "Run the tests of how the tasks call the Unity CLI (never as the Editor binary, no flag unity run manages itself, smoke without -quit)"
run = "sh scripts/tasks-test.sh"

[server-tuning-test]
description = "Run the tests of scripts/server-tuning.sh, which checks that each server-data/tuning JSON equals the Assets/kits/shooter/Resources/Tuning file of the same name, and that a file on one side only, or one the server keeps its own copy of, is listed in scripts/server-tuning.txt"
run = "sh scripts/server-tuning-test.sh"

[server-rules-test]
description = "Run the tests of scripts/server-rules.sh, which checks that each server-data/rules JSON is one make export-server-rules writes (a rules asset listed in the net match, or one with an objective) or is listed in server-data/rules/hand-written.txt"
run = "sh scripts/server-rules-test.sh"

[docker-sources-test]
description = "Run the tests of scripts/docker-sources.sh, which checks that docker/server/Dockerfile copies, and its dockerignore keeps, every Assets folder a non-test dotnet project compiles"
run = "sh scripts/docker-sources-test.sh"
